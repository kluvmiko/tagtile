<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f4ef" />
  <meta name="description" content="TagTile. Your world. One tile." />
  <title>TagTile — Your world. One tile.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f5f4ef;--ink:#111;--muted:#77756f;--card:#fff;--line:#dedcd5;--accent:#111;--profile-bg:#f5f4ef;--profile-ink:#111;--profile-card:#fff}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
    button,input,textarea,select{font:inherit}button,a{-webkit-tap-highlight-color:transparent}.page{min-height:100svh;max-width:680px;margin:auto;padding:20px 20px 30px;display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;padding:5px 0}.logo{font-size:22px;font-weight:800;letter-spacing:-1px}.mini,.muted{font-size:12px;color:var(--muted)}main{flex:1}.hero{padding:clamp(55px,12vh,110px) 0 45px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}.eyebrow:before{content:'';display:inline-block;width:7px;height:7px;background:#111;border-radius:50%;margin:0 9px 1px 0}h1{font-size:clamp(58px,15vw,100px);line-height:.87;letter-spacing:-.085em;margin:0;font-weight:800}.sub{font-size:17px;line-height:1.55;color:#5d5b55;max-width:440px;margin:26px 0 28px}.btn{border:0;border-radius:999px;background:#111;color:#fff;padding:16px 22px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;min-height:52px}.btn.light{background:#fff;color:#111;border:1px solid var(--line)}.btn:disabled{opacity:.5;cursor:wait}.tile-stage{display:flex;justify-content:center;padding:15px 0 45px}.tile{width:min(60vw,230px);aspect-ratio:1;background:#111;border-radius:28px;display:grid;place-items:center;transform:rotate(-6deg);box-shadow:0 25px 55px #0002}.tile-inner{width:54%;aspect-ratio:1;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0/18px 18px;border:9px solid white;border-radius:3px}.foot{border-top:1px solid var(--line);padding-top:15px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;margin:28px 0;box-shadow:0 12px 40px #00000008}.panel h2{font-size:24px;letter-spacing:-.05em;margin:0 0 7px}.panel p{color:var(--muted);font-size:13px;line-height:1.5}.field{display:grid;gap:7px;margin:16px 0}.field label{font-size:12px;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#faf9f6;border-radius:12px;padding:13px 14px;color:#111;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#777}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.swatches{display:flex;gap:10px;flex-wrap:wrap}.swatch{width:38px;height:38px;border-radius:50%;border:2px solid #ddd;cursor:pointer}.swatch[aria-pressed=true]{outline:2px solid #111;outline-offset:3px}.link-row{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin:9px 0}.link-row input{min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px;background:#faf9f6}.notice{background:#f3f1eb;border-radius:14px;padding:13px;font-size:12px;line-height:1.5;color:#56534d;overflow-wrap:anywhere}.center{text-align:center}.qr{width:220px;height:220px;object-fit:contain;background:#fff;padding:8px;border-radius:14px;border:1px solid var(--line)}.profile{min-height:100svh;background:var(--profile-bg);color:var(--profile-ink);padding:30px 18px 55px}.profile-wrap{max-width:480px;margin:auto}.profile-top{text-align:center;padding:35px 0 24px}.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;background:#ddd;margin:0 auto 18px;display:block}.avatar-fallback{width:104px;height:104px;border-radius:50%;margin:0 auto 18px;background:#ddd;display:grid;place-items:center;font-size:36px;font-weight:800}.profile-name{font-size:34px;letter-spacing:-.06em;margin:0}.profile-bio{font-size:14px;line-height:1.6;opacity:.72;white-space:pre-wrap;margin:10px auto 0;max-width:360px}.profile-links{display:grid;gap:11px;margin:24px 0}.profile-link{display:flex;align-items:center;justify-content:space-between;padding:17px 18px;border-radius:15px;background:var(--profile-card);color:var(--profile-ink);text-decoration:none;font-size:14px;font-weight:700;border:1px solid #00000010}.profile-link span:last-child{opacity:.5}.profile-brand{text-align:center;font-size:11px;opacity:.5;margin-top:35px}.top-actions{display:flex;justify-content:space-between;align-items:center;gap:10px}.small-link{font-size:12px;color:var(--muted);text-decoration:none}.hidden{display:none!important}.error{color:#a32626;font-size:13px}.success{color:#176b3a;font-size:13px}.loader{padding:80px 0;text-align:center;color:var(--muted)}
    @media(max-width:480px){.panel{padding:18px}.row{grid-template-columns:1fr}.hero{padding-top:70px}.link-row{grid-template-columns:1fr 1.3fr}}
  </style>
</head>
<body>
<div id="app"><div class="loader">Opening your TagTile…</div></div>
<script>
const app=document.getElementById('app');
const palettes=[{name:'Paper',bg:'#f5f4ef',ink:'#111111',card:'#ffffff'},{name:'Midnight',bg:'#111318',ink:'#f7f7f4',card:'#242731'},{name:'Blush',bg:'#f7e9e7',ink:'#392a2a',card:'#fff9f7'},{name:'Ocean',bg:'#e7f0f2',ink:'#18333b',card:'#ffffff'},{name:'Sage',bg:'#e9eee5',ink:'#253126',card:'#fbfff8'},{name:'Lavender',bg:'#eeeafa',ink:'#30284a',card:'#ffffff'}];
const api='/ .netlify/functions/profile'.replace('/ ','/');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanUrl=s=>{try{const u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}};
function shell(body){app.innerHTML=`<div class="page"><header><div class="logo">TagTile</div><div class="mini">your digital world</div></header><main>${body}</main><footer class="foot"><span>© 2026 TagTile</span><span>Made to be scanned.</span></footer></div>`}
function home(){shell(`<section class="hero"><div class="eyebrow">One tile. Everything.</div><h1>Your world.<br>One tile.</h1><p class="sub">A simple digital home for your links, socials, websites, payments, and whatever you want to share.</p><button class="btn" id="create">Create your TagTile <span>↗</span></button></section><div class="tile-stage"><div class="tile"><div class="tile-inner"></div></div></div><div class="muted">Create a unique QR code, personalize your page, and keep the same code forever.</div>`);document.getElementById('create').onclick=createTile}
function createTile(){const id='tt-'+crypto.randomUUID().replaceAll('-','').slice(0,16);const url=location.origin+'/t/'+id;const qr='https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=12&data='+encodeURIComponent(url);shell(`<div class="panel center"><h2>Your TagTile is ready to begin.</h2><p>This is its permanent QR code. Scan it with your phone to personalize the page. After the first save, future scans open the finished profile.</p><img class="qr" src="${qr}" alt="Your TagTile QR code"><p class="notice">${esc(url)}</p><a class="btn light" href="${qr}" download="tagtile-${id}.png" target="_blank" rel="noopener">Download QR code ↗</a><p class="muted">Keep this QR code. It is permanently connected to this TagTile.</p><button class="btn" id="open">Open setup on this device</button></div>`);document.getElementById('open').onclick=()=>location.href='/t/'+id}
function formMarkup(data={},isEdit=false){const p=data.palette||'Paper';const links=[...(data.links||[])];while(links.length<4)links.push({label:'',url:''});return `<div class="panel"><div class="top-actions"><span class="eyebrow">${isEdit?'Edit your page':'First-time setup'}</span><span class="muted">${isEdit?'Your changes go live instantly':'Make it yours'}</span></div><h2>${isEdit?'Make it yours.':'Build your digital world.'}</h2><p>Choose what people see when they scan your TagTile. You can change this later.</p><form id="profileForm"><div class="field"><label for="name">Display name *</label><input id="name" maxlength="50" required placeholder="Your name" value="${esc(data.name||'')}"></div><div class="field"><label for="bio">A little about you</label><textarea id="bio" maxlength="240" placeholder="A short intro, a thought, or whatever feels like you…">${esc(data.bio||'')}</textarea></div><div class="field"><label for="avatar">Profile photo URL (optional)</label><input id="avatar" type="url" placeholder="https://…" value="${esc(data.avatar||'')}"></div><div class="field"><label>Choose your look</label><div class="swatches">${palettes.map(x=>`<button type="button" class="swatch" title="${x.name}" aria-label="${x.name}" data-palette="${x.name}" aria-pressed="${x.name===p}" style="background:${x.bg};border-color:${x.ink}"></button>`).join('')}</div><input type="hidden" id="palette" value="${esc(p)}"></div><div class="field"><label>Your links</label><p>Add your socials, website, payment page, portfolio, or anything else. Leave unused rows blank.</p>${links.map((l,i)=>`<div class="link-row"><input aria-label="Link ${i+1} title" class="link-label" maxlength="28" placeholder="Instagram" value="${esc(l.label||'')}"><input aria-label="Link ${i+1} URL" class="link-url" type="url" placeholder="https://…" value="${esc(l.url||'')}"></div>`).join('')}</div><button class="btn" type="submit" id="save">${isEdit?'Save changes':'Save my TagTile'} <span>↗</span></button><p id="formMessage" role="status"></p></form></div>`}
function readForm(){const links=[...document.querySelectorAll('.link-row')].map(r=>({label:r.querySelector('.link-label').value.trim(),url:r.querySelector('.link-url').value.trim()})).filter(x=>x.label&&x.url);return{name:document.getElementById('name').value.trim(),bio:document.getElementById('bio').value.trim(),avatar:document.getElementById('avatar').value.trim(),palette:document.getElementById('palette').value,links}}
function bindForm(data,isEdit,saveFn){document.querySelectorAll('[data-palette]').forEach(b=>b.onclick=()=>{document.getElementById('palette').value=b.dataset.palette;document.querySelectorAll('[data-palette]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))) });document.getElementById('profileForm').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('formMessage'),btn=document.getElementById('save');const d=readForm();if(!d.name){msg.className='error';msg.textContent='Please add a display name.';return}if(d.avatar&&!cleanUrl(d.avatar)){msg.className='error';msg.textContent='Please use a valid photo URL.';return}for(const l of d.links){if(!cleanUrl(l.url)){msg.className='error';msg.textContent='One of your links is not a valid http or https URL.';return}}btn.disabled=true;btn.textContent='Saving…';try{await saveFn(d)}catch(err){msg.className='error';msg.textContent=err.message||'Something went wrong. Please try again.';btn.disabled=false;btn.textContent=isEdit?'Save changes':'Save my TagTile'}}}
async function request(method,body,id){const endpoint=method==='GET'&&id?api+'?id='+encodeURIComponent(id):api;const r=await fetch(endpoint,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Could not connect. Check your setup and try again.');return j}
function showProfile(id,data){const pal=palettes.find(p=>p.name===data.palette)||palettes[0];document.documentElement.style.setProperty('--profile-bg',pal.bg);document.documentElement.style.setProperty('--profile-ink',pal.ink);document.documentElement.style.setProperty('--profile-card',pal.card);const avatar=data.avatar&&cleanUrl(data.avatar)?`<img class="avatar" src="${esc(data.avatar)}" alt="">`:`<div class="avatar-fallback">${esc((data.name||'T').slice(0,1).toUpperCase())}</div>`;app.innerHTML=`<div class="profile"><div class="profile-wrap"><div class="top-actions"><strong>TagTile</strong><span class="muted">your digital world</span></div><section class="profile-top">${avatar}<h1 class="profile-name">${esc(data.name||'')}</h1>${data.bio?`<p class="profile-bio">${esc(data.bio)}</p>`:''}</section><div class="profile-links">${(data.links||[]).map(l=>{const u=cleanUrl(l.url);return u?`<a class="profile-link" href="${esc(u)}" target="_blank" rel="noopener noreferrer"><span>${esc(l.label)}</span><span>↗</span></a>`:''}).join('')}</div><div class="profile-brand">Made with TagTile</div></div></div>`}
function showSaved(id,key){const editUrl=location.origin+'/edit/'+id+'?key='+encodeURIComponent(key);shell(`<div class="panel"><div class="eyebrow">You're all set</div><h2>Your TagTile is live.</h2><p>From now on, scanning this same QR code opens your personalized page. Keep your private edit link somewhere safe so you can update it later.</p><div class="notice" id="editLink">${esc(editUrl)}</div><button class="btn" id="copy">Copy my private edit link</button> <a class="btn light" href="/t/${id}">View my page ↗</a><p class="muted">Anyone with the edit link can change this TagTile. Do not share it publicly.</p></div>`);document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(editUrl);document.getElementById('copy').textContent='Copied ✓'} }
async function tagRoute(id){if(!/^tt-[a-f0-9]{16}$/.test(id)){shell(`<div class="panel"><h2>That TagTile link doesn't look right.</h2><p>Check the QR code and try again.</p></div>`);return}try{const r=await request('GET',null,id);const data=r.profile?.id===id?r.profile:null;if(data){showProfile(id,data.data);return}shell(formMarkup({},false));bindForm({},false,async d=>{const key=Array.from(crypto.getRandomValues(new Uint8Array(32))).map(x=>x.toString(16).padStart(2,'0')).join('');await request('POST',{id,data:d,key});showSaved(id,key)})}catch(e){shell(`<div class="panel"><h2>TagTile needs its database connection.</h2><p>${esc(e.message)}</p><p class="muted">The site owner needs to finish the Supabase and Netlify setup described in the project README.</p></div>`)}}
async function editRoute(id){const key=new URLSearchParams(location.search).get('key');if(!key){shell(`<div class="panel"><h2>Private edit link required.</h2><p>Open the private edit link you received when you first saved this TagTile.</p></div>`);return}try{const r=await request('GET',null,id);const profile=r.profile?.id===id?r.profile:null;if(!profile)throw new Error('This TagTile has not been set up yet.');shell(formMarkup(profile.data,true));bindForm(profile.data,true,async d=>{await request('PUT',{id,data:d,key});showSaved(id,key)})}catch(e){shell(`<div class="panel"><h2>Couldn't open the editor.</h2><p>${esc(e.message)}</p></div>`)}}
const path=location.pathname.split('/').filter(Boolean);if(path[0]==='t'&&path[1])tagRoute(path[1]);else if(path[0]==='edit'&&path[1])editRoute(path[1]);else home();
</script>
</body>
</html>
